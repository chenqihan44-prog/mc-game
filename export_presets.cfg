[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,assets/*.md,assets/*.txt"
exclude_filter="tests/*,tools/*,docs/*,test-results/*,.tools/*"
export_path="builds/EmberLighthouse/EmberLighthouse.exe"
encryption_include_filters=""
